description: >-
  Entity graph derived from components.schemas of the OpenAPI 3.1.0 that APILayer publishes
  for mailboxlayer. Re-derived 2026-08-14 from the provider's own SwaggerHub document rather
  than from this repo's thinner refined spec, which adds the bulk response shape and the
  RequestValidationError entity that were previously missing.

  The model is deliberately flat: mailboxlayer is a stateless lookup service that returns a
  computed verification result. It persists no customer-addressable resources, so there are
  no ids, no id-prefixes, and no cross-entity foreign keys.

