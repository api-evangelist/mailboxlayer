conceptual_subjects:
  - name: Email Address
    description: >-
      The address under verification is the primary subject of the model, but it is an
      input value, not a stored resource. mailboxlayer returns no handle by which a prior
      check can be retrieved, re-read, or referenced in a support conversation.
  - name: Domain
    description: >-
      Derived from the address; the target of the MX, catch-all, free and disposable
      checks. Not addressable on its own — there is no domain-level endpoint.

reference_data:
  - name: Free provider database
    description: Daily-updated list of free webmail providers backing the `free` field.
    addressable: false
  - name: Disposable provider database
    description: Daily-updated list of throwaway providers backing the `disposable` field.
    addressable: false

reference_data_note: >-
  Both databases are described in the documentation as regularly updated, but neither is
  exposed as an API resource — there is no endpoint to list, query, or diff them, and no
  published update cadence beyond "daily".

