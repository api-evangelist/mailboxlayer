remediation:
  for_provider:
    - >-
      Serve /.well-known/security.txt (RFC 9116) on mailboxlayer.com naming a Contact and
      a Policy URL. APILayer currently publishes no vulnerability-disclosure address at all.
    - >-
      Stop returning HTTP 200 from apilayer.net for unrouted paths. A 404 for an unknown
      path is what lets any client — human, crawler, or agent — tell "not found" from
      "found but unauthorized".
