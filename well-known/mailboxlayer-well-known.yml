result: no-documents-found
description: >-
  Recorded ABSENCE. Not one /.well-known/ document is served on any host associated with
  mailboxlayer. Two distinct failure modes were observed and they are recorded separately
  because they mean different things.

  1. The website, docs portal and parent-brand hosts (mailboxlayer.com, docs.apilayer.com,
     apilayer.com) return an honest HTTP 404 with an HTML page for every /.well-known/ path.

  2. The API host apilayer.net returns HTTP 200 for EVERY path — including paths that
     cannot exist — with the mailboxlayer error envelope
     {"success": false, "error": {"code": 101, "type": "invalid_access_key", ...}}.
     This is a catch-all soft-200, NOT a document. It is recorded as a MISS. A probe that
     trusted the status code alone would credit apilayer.net with a security.txt, an
     OpenID configuration, an OAuth authorization server AND an agent card, none of which
     exist.

  Because nothing returned a real document, NO `WellKnown` and NO `SecurityTxt` pointer is
  emitted in apis.yml. This file documents an absence; it must never be scored as a presence.

hosts:
