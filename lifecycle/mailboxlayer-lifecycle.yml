description: >-
  Lifecycle posture for the mailboxlayer Verification API. Searched 2026-08-14 across the
  developer portal, the parent APILayer site and the APILayer changelog product. The result
  is mostly absence, and the absences are the finding: mailboxlayer publishes a status page
  but no versioning policy, no deprecation policy, no Sunset/Deprecation header support,
  no SLA document and no dated changelog of its own.

versioning:
  scheme: none-in-path
  current: null
  spec_version: '1.0.0'
  spec_version_source: >-
    info.version of the OpenAPI APILayer publishes at
    https://api.swaggerhub.com/apis/apilayer-863/MailboxlayerAPI/1.0.0/swagger.json
  policy_url: null
  header: null
  note: >-
    The base URL https://apilayer.net/api carries no version segment, no version query
    parameter and no version header is documented. The only version identifier that exists
    anywhere is the SwaggerHub document's own 1.0.0 label. There is no published statement
    of what constitutes a breaking change, and therefore no contract about how one would be
    communicated.

deprecation:
  policy_url: null
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  note: >-
    No deprecation policy, no Sunset header, no Deprecation header. NOT wired as a
    `Deprecation` pointer in apis.yml — there is nothing to point at.
  historical_evidence: >-
    APILayer has retired sibling products before (giflayer, languagelayer, pdflayer,
    screenshotlayer and streetlayer all have archived repositories in the apilayer GitHub
    organization) without any published deprecation or sunset process, so the absence here
    is a live risk rather than a formality.

