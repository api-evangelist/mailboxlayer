agent_hazards:
  - id: success-is-not-http-status
    description: >-
      mailboxlayer returns service-level failures with HTTP 200 and a `success: false`
      body. Any tool wrapper that branches on the status code will report an invalid key,
      an exhausted quota, or an unparseable address as a successful verification. A tool
      implementation MUST inspect `success` and `error.code`.
    reference: errors/mailboxlayer-problem-types.yml
  - id: key-in-query-string
    description: >-
      The access key is a query parameter, so it lands in proxy logs, browser history and
      any agent trace that records request URLs. Redact `access_key` before logging.
    reference: authentication/mailboxlayer-authentication.yml
  - id: catch-all-defaults-null
    description: >-
      `catch_all` is null unless `catch_all=1` is passed AND the plan allows it. An agent
      that reads null as false will mis-score catch-all domains.
