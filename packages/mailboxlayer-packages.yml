method: searched
source: >-
  npm registry (registry.npmjs.org), PyPI (pypi.org), RubyGems (rubygems.org),
  Packagist (repo.packagist.org) and the apilayer GitHub organization
  (api.github.com/orgs/apilayer/repos), queried 2026-08-14.
description: >-
  Client libraries for the mailboxlayer Verification API. APILayer publishes NO
  currently-maintained first-party SDK: the only first-party packages on any registry
  are @apilayer/mailboxlayer (npm, last published 2019-10-01, single version 0.1.6)
  and email-address-validation (npm, last published 2016-02-10), and the matching
  GitHub repositories — apilayer/mailboxlayer-API and apilayer/email-address-validation —
  are both ARCHIVED. Everything else in this file is community-maintained. The docs
  themselves ship only inline PHP-cURL and jQuery.ajax snippets rather than an SDK.

summary:
  official_count: 2
  official_maintained_count: 0
  community_count: 6
  registries_checked: [npm, pypi, rubygems, packagist, github]
  registries_with_no_result: [pypi]
  note: >-
    A first-party SDK whose last release predates the API it wraps is an abandonment
    signal. The mailboxlayer OpenAPI published on SwaggerHub in 2026 documents a
    /bulk_check endpoint and a catch_all parameter that the 2019 npm package cannot
    have covered.

